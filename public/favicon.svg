<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#0f172a"/>
  <!-- Smartwatch Bezel Ring -->
  <circle cx="256" cy="256" r="190" stroke="url(#ringGrad)" stroke-width="28" stroke-dasharray="14 10" opacity="0.85"/>
  <circle cx="256" cy="256" r="160" stroke="#1e293b" stroke-width="4"/>
  <!-- Navigation Pointer Arrow -->
  <path d="M256 120 L350 350 L256 300 L162 350 Z" fill="url(#arrowGrad)" filter="url(#glow)"/>
  <!-- Arrow Center Spine -->
  <path d="M256 120 L350 350 L256 300 Z" fill="#000000" opacity="0.15"/>
  <circle cx="256" cy="256" r="10" fill="#ffffff" opacity="0.8"/>
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="256" y1="120" x2="256" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="120" y="80" width="272" height="310" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.45"/>
    </filter>
  </defs>
</svg>